    - {country: albania,      category: [clear_pathway]}
    - {country: kosovo,       category: [clear_pathway]}
    - {country: turkey,       category: [popular_ru]}
    - {country: georgia,      category: [popular_ru, it_friendly]}
    - {country: armenia,      category: [popular_ru]}
    - {country: azerbaijan,   category: [popular_ru]}

  middle_east_gulf:
    - {country: uae,          category: [it_friendly, popular_ru]}
    - {country: saudi-arabia, category: [it_friendly]}
    - {country: qatar,        category: [it_friendly]}
    - {country: oman,         category: [clear_pathway]}
    - {country: kuwait,       category: [it_friendly]}
    - {country: bahrain,      category: [it_friendly]}
    - {country: israel,       category: [it_friendly]}

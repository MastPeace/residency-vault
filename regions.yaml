    - {country: romania,      category: [clear_pathway]}
    - {country: bulgaria,     category: [clear_pathway, popular_ru]}
    - {country: estonia,      category: [it_friendly]}
    - {country: latvia,       category: [popular_ru]}
    - {country: lithuania,    category: [popular_ru]}
    - {country: slovenia,     category: [clear_pathway]}
    - {country: croatia,      category: [yacht_captain, it_friendly]}
    - {country: greece,       category: [strong_passport, clear_pathway]}
    - {country: cyprus,       category: [strong_passport, yacht_captain]}

# Global country registry for the residency database.
# Grouped by region. The build dispatches a v4-pro subagent per region; each writes
# its own conditions/<country>.md files per SCHEMA v2 (generalized residency taxonomy).
# 'category' = the dominant market category for frontmatter (may be multi).

regions:
  eu_western:
    - {country: portugal,     category: [strong_passport, it_friendly, clear_pathway]}
    - {country: spain,        category: [strong_passport, it_friendly, clear_pathway]}
    - {country: france,       category: [strong_passport, clear_pathway]}
    - {country: italy,        category: [strong_passport, clear_pathway]}
    - {country: germany,      category: [strong_passport, it_friendly]}
    - {country: austria,      category: [strong_passport, it_friendly]}
    - {country: netherlands,  category: [strong_passport, it_friendly]}
    - {country: belgium,      category: [strong_passport, clear_pathway]}
    - {country: luxembourg,   category: [strong_passport, it_friendly]}
    - {country: denmark,      category: [strong_passport, it_friendly]}
    - {country: sweden,       category: [strong_passport, it_friendly]}
    - {country: finland,      category: [strong_passport, it_friendly]}
    - {country: ireland,      category: [strong_passport, it_friendly]}
    - {country: united-kingdom, category: [strong_passport, it_friendly]}
    - {country: switzerland,  category: [strong_passport, it_friendly]}
    - {country: norway,       category: [strong_passport, it_friendly]}
    - {country: iceland,      category: [strong_passport, clear_pathway]}

  eu_eastern:
    - {country: poland,       category: [it_friendly, popular_ru]}
    - {country: czechia,      category: [it_friendly, popular_ru]}
    - {country: slovakia,     category: [clear_pathway, popular_ru]}

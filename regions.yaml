# Global country registry for the residency database.
# Grouped by region. The build dispatches a v4-pro subagent per region; each writes
# its own conditions/<country>.md files per SCHEMA v2 (generalized residency taxonomy).
# 'category' = the dominant market category for frontmatter (may be multi).

